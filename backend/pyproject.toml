[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "Windows"
extraPaths = [
    ".",
    "C:/Users/YUG SHAH/AppData/Roaming/Python/Python313/site-packages"
]

[tool.pyrefly]
python_version = "3.13"
python_interpreter = "C:/Python313/python.exe"
search_paths = [
    ".",
    "C:/Users/YUG SHAH/AppData/Roaming/Python/Python313/site-packages"
]


